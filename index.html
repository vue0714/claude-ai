<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn Hangul online for free</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F6F5;
  --paper-2:#E5EDEA;
  --ink:#1B2A4A;
  --ink-soft:#4A587A;
  --celadon:#2F7A70;
  --line:#C6D3CF;
  --card:#FFFFFF;
  --cta:#B83227;
  --cta-fg:#FFFFFF;
  --serif:'Gowun Batang','Noto Serif KR','Batang','Apple Myungjo',Georgia,serif;
  --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1729;
    --paper-2:#16213A;
    --ink:#E8EEF2;
    --ink-soft:#A3B0C8;
    --celadon:#6FC0B2;
    --line:#2A3A5A;
    --card:#16213A;
    --cta:#F2907F;
    --cta-fg:#2A0E0B;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1729;
  --paper-2:#16213A;
  --ink:#E8EEF2;
  --ink-soft:#A3B0C8;
  --celadon:#6FC0B2;
  --line:#2A3A5A;
  --card:#16213A;
  --cta:#F2907F;
  --cta-fg:#2A0E0B;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
html[lang="ko"] body{word-break:keep-all}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;margin:0}
p{margin:0}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
:focus-visible{outline:3px solid var(--celadon);outline-offset:3px;border-radius:2px}

/* header */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.site-header .wrap{display:flex;align-items:center;gap:20px;height:64px}
.brand{font-family:var(--serif);font-weight:700;font-size:1.15rem;text-decoration:none;margin-right:auto;white-space:nowrap}
.site-nav{display:flex;gap:22px}
.site-nav a{text-decoration:none;font-size:.95rem;color:var(--ink-soft)}
.site-nav a:hover{color:var(--ink)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:inherit;font-size:.85rem;background:none;border:0;color:var(--ink-soft);padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* buttons */
.btn{display:inline-block;font:inherit;font-weight:700;font-size:.98rem;text-decoration:none;padding:13px 24px;border-radius:4px;border:2px solid transparent;cursor:pointer;line-height:1.3;text-align:center}
.btn-cta{background:var(--cta);color:var(--cta-fg)}
.btn-cta:hover{filter:brightness(1.07)}
.btn-line{border-color:var(--ink);color:var(--ink);background:transparent}
.btn-line:hover{background:var(--ink);color:var(--paper)}
.btn-sm{padding:8px 16px;font-size:.9rem}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}

/* hero */
.hero{padding:72px 0 88px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(2.3rem,5.2vw,3.7rem);letter-spacing:-.01em}
.hero p.lead{margin-top:22px;max-width:30em;font-size:1.1rem;color:var(--ink-soft)}
.hero .actions{margin-top:32px;display:flex;flex-wrap:wrap;gap:12px}

/* the writing cell */
.cell{position:relative;width:min(220px,100%);aspect-ratio:1;margin:0 auto;border:2px solid var(--ink);display:grid;place-items:center;background:var(--paper)}
.cell::before,.cell::after{content:"";position:absolute;pointer-events:none}
.cell::before{left:0;right:0;top:50%;border-top:1.5px dashed var(--celadon)}
.cell::after{top:0;bottom:0;left:50%;border-left:1.5px dashed var(--celadon)}
.glyph{position:relative;z-index:1;font-family:var(--serif);font-size:8.4rem;line-height:1;display:block}
.glyph.settle{animation:settle .9s cubic-bezier(.2,.8,.2,1) both}
.glyph.pop{animation:pop .3s ease-out}
@keyframes settle{from{opacity:0;transform:translateY(-18px) scale(.9)}to{opacity:1;transform:none}}
@keyframes pop{50%{transform:scale(1.07)}}

.builder{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:28px}
.builder h2{font-size:1.25rem}
.builder .hint{font-size:.92rem;color:var(--ink-soft);margin:6px 0 22px}
.readout{margin-top:18px;text-align:center}
.formula{font-family:var(--serif);font-size:1.3rem;letter-spacing:.02em}
.sound{margin-top:4px;color:var(--ink-soft);font-size:.95rem;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.sound strong{color:var(--ink);font-weight:700}
.listen{font:inherit;font-size:.85rem;background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:3px 12px;cursor:pointer}
.listen:hover{border-color:var(--celadon);color:var(--celadon)}
.group{margin-top:20px}
.group .label{font-size:.88rem;color:var(--ink-soft);margin-bottom:8px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--serif);font-size:1.2rem;min-width:42px;min-height:42px;padding:0 10px;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:4px;cursor:pointer;line-height:1}
.chip:hover{border-color:var(--celadon)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip-none{font-family:var(--sans);font-size:.85rem}

/* sections */
section{padding:84px 0}
.tint{background:var(--paper-2)}
.sec-head{max-width:38em;margin-bottom:44px}
.sec-head h2{font-size:clamp(1.7rem,3.4vw,2.35rem)}
.sec-head p{margin-top:12px;color:var(--ink-soft)}

/* course map */
.units{border-bottom:1px solid var(--line)}
.unit{display:grid;grid-template-columns:150px 1fr auto;gap:24px;align-items:center;padding:26px 0;border-top:1px solid var(--line)}
.unit .g{font-family:var(--serif);font-size:3.2rem;line-height:1;color:var(--celadon)}
.unit.soon .g{color:var(--ink-soft);opacity:.55}
.unit h3{font-size:1.3rem;margin-bottom:4px}
.unit p{color:var(--ink-soft);max-width:38em}
.status{font-size:.85rem;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:3px 14px;white-space:nowrap}

/* lesson: unit 1 */
.lesson{display:grid;grid-template-columns:.8fr 1.2fr;gap:52px;align-items:start}
.vowel-view{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:28px;position:sticky;top:calc(84px + env(safe-area-inset-top,0px))}
.vowel-desc{margin-top:8px;color:var(--ink-soft);font-size:.95rem;min-height:3.2em}
.vgroup{margin-bottom:28px}
.vgroup .label{font-size:.95rem;font-weight:500;margin-bottom:10px;display:block}
.vchip{font-size:1.7rem;min-width:60px;min-height:60px}
.note{font-size:.9rem;color:var(--ink-soft);max-width:34em}
.tip{border-left:3px solid var(--celadon);padding:2px 0 2px 16px;color:var(--ink-soft);max-width:36em;margin-top:8px}
.sub{margin-top:72px}
.sub h3{font-size:1.5rem;margin-bottom:8px}
.sub > p{color:var(--ink-soft);margin-bottom:22px;max-width:36em}
.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.word{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 12px;text-align:center;cursor:pointer}
.word:hover{border-color:var(--celadon)}
.word .h{display:block;font-family:var(--serif);font-size:2.3rem;line-height:1.2}
.word .m{display:block;font-size:.9rem;color:var(--ink-soft);visibility:hidden;margin-top:4px}
.word[aria-expanded="true"] .m{visibility:visible}

/* quiz */
.quiz{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:28px;max-width:640px}
.qz-progress{font-size:.88rem;color:var(--ink-soft);margin-bottom:6px}
.qz-prompt{font-weight:500;font-size:1.1rem}
.qz-glyph{font-family:var(--serif);font-size:4.5rem;line-height:1.2;margin:8px 0 4px}
.qz-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
.opt{font:inherit;font-size:1.05rem;min-height:56px;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:4px;cursor:pointer}
.opt-glyph{font-family:var(--serif);font-size:1.8rem}
.opt:hover{border-color:var(--celadon)}
.opt.ok{background:var(--celadon);border-color:var(--celadon);color:var(--paper)}
.opt.bad{background:var(--cta);border-color:var(--cta);color:var(--cta-fg)}
.qz-feedback{min-height:1.7em;margin:14px 0 4px;font-weight:500}
.qz-result{font-family:var(--serif);font-size:1.6rem;font-weight:700}
.qz-sub{color:var(--ink-soft);margin:8px 0 20px}

/* more to learn */
.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:32px}
.book{display:flex;flex-direction:column}
.cover{aspect-ratio:3/4;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:4rem;position:relative;box-shadow:inset 14px 0 0 rgba(0,0,0,.18),0 10px 24px -12px rgba(0,0,0,.4);margin-bottom:18px;border-radius:2px 6px 6px 2px}
.cover small{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-family:var(--sans);font-size:.78rem;font-weight:400;letter-spacing:.04em;opacity:.85}
.cv1{background:#1B2A4A;color:#DCE7F0}
.cv2{background:#2F7A70;color:#FFFFFF}
.cv3{background:#B83227;color:#FFFFFF}
.cv4{background:#3B4A75;color:#FFFFFF}
.book h3{font-size:1.15rem;margin-bottom:8px}
.book p{font-size:.93rem;color:var(--ink-soft);flex:1}
.pills{margin-top:12px}
.pill{display:inline-block;font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--ink-soft);margin-right:6px}
.notify{margin-top:40px}

/* tutoring */
.book-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;align-items:stretch}
.way{padding:32px;border-radius:6px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:flex-start}
.way.primary{border:2px solid var(--ink)}
.way h3{font-size:1.4rem;margin-bottom:10px}
.way p{color:var(--ink-soft);margin-bottom:24px;flex:1;max-width:34em}

/* about */
.about{display:grid;grid-template-columns:240px 1fr;gap:56px;align-items:center}
.about .glyph{font-size:5.6rem}
.about h2{font-size:clamp(1.7rem,3.4vw,2.35rem);margin-bottom:16px}
.about p{max-width:36em;color:var(--ink-soft)}
.links{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px 22px}
.links a{font-weight:500;text-underline-offset:4px}

/* faq */
.faq{max-width:760px}
details{border-top:1px solid var(--line)}
details:last-child{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:18px 40px 18px 0;font-weight:500;position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:1.5rem;color:var(--celadon);transition:transform .2s}
details[open] summary::after{transform:translateY(-50%) rotate(45deg)}
details p{padding:0 0 20px;color:var(--ink-soft);max-width:38em}

/* closing */
.closing{background:var(--ink);color:var(--paper);text-align:center;padding:84px 0}
.closing h2{font-size:clamp(1.8rem,3.6vw,2.6rem);max-width:16em;margin:0 auto}
.closing p{margin:14px auto 0;max-width:30em;opacity:.8}
.closing .actions{margin-top:30px;display:flex;justify-content:center;flex-wrap:wrap;gap:12px}
footer{padding:28px 0;font-size:.85rem;color:var(--ink-soft);text-align:center}

@media (max-width:900px){
  .hero .wrap{grid-template-columns:1fr;gap:44px}
  .lesson{grid-template-columns:1fr;gap:32px}
  .vowel-view{position:static}
  .about{grid-template-columns:1fr;gap:32px}
  .about .cell{margin:0}
  .book-grid{grid-template-columns:1fr}
}
@media (max-width:760px){
  .site-nav{display:none}
  .header-cta{display:none}
}
@media (max-width:560px){
  body{font-size:16px}
  .hero{padding:44px 0 64px}
  section{padding:60px 0}
  .unit{grid-template-columns:1fr;gap:10px}
  .builder,.vowel-view,.quiz{padding:20px}
  .glyph{font-size:7rem}
  .vchip{min-width:54px;min-height:54px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="#top" data-t="brand"></a>
    <nav class="site-nav" aria-label="Main">
      <a href="#course" data-t="nav_course"></a>
      <a href="#more" data-t="nav_more"></a>
      <a href="#tutoring" data-t="nav_tutor"></a>
      <a href="#about" data-t="nav_about"></a>
      <a href="#faq" data-t="nav_faq"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ko" aria-pressed="false">한국어</button>
    </div>
    <a class="btn btn-cta btn-sm header-cta" href="#unit1" data-t="cta_start"></a>
  </div>
</header>

<main id="top">

<div class="hero">
  <div class="wrap">
    <div>
      <h1 data-t="hero_title"></h1>
      <p class="lead" data-t="hero_sub"></p>
      <div class="actions">
        <a class="btn btn-cta" href="#unit1" data-t="hero_cta1"></a>
        <a class="btn btn-line" href="#course" data-t="hero_cta2"></a>
      </div>
    </div>

    <div class="builder" aria-labelledby="b-title">
      <h2 id="b-title" data-t="b_title"></h2>
      <p class="hint" data-t="b_hint"></p>
      <div class="cell"><span class="glyph settle" id="glyph" aria-hidden="true">한</span></div>
      <div class="readout" aria-live="polite">
        <div class="formula" id="formula">한 = ㅎ + ㅏ + ㄴ</div>
        <div class="sound">
          <span><span data-t="b_sound"></span> <strong id="roman">han</strong></span>
          <button type="button" class="listen" id="listen" hidden data-t="b_listen"></button>
        </div>
      </div>
      <div class="group" role="group" aria-labelledby="l-init">
        <span class="label" id="l-init" data-t="b_initial"></span>
        <div class="chips" id="chips-i"></div>
      </div>
      <div class="group" role="group" aria-labelledby="l-med">
        <span class="label" id="l-med" data-t="b_vowel"></span>
        <div class="chips" id="chips-m"></div>
      </div>
      <div class="group" role="group" aria-labelledby="l-fin">
        <span class="label" id="l-fin" data-t="b_final"></span>
        <div class="chips" id="chips-f"></div>
      </div>
    </div>
  </div>
</div>

<section id="course" class="tint">
  <div class="wrap">
    <div class="sec-head"><h2 data-t="co_title"></h2><p data-t="co_sub"></p></div>
    <div class="units">
      <div class="unit">
        <div class="g" aria-hidden="true">ㅏ</div>
        <div><h3 data-t="u1_t"></h3><p data-t="u1_d"></p></div>
        <a class="btn btn-cta btn-sm" href="#unit1" data-t="u1_btn"></a>
      </div>
      <div class="unit">
        <div class="g" aria-hidden="true">ㄱ</div>
        <div><h3 data-t="u2_t"></h3><p data-t="u2_d"></p></div>
        <a class="btn btn-cta btn-sm" href="#unit2" data-t="u1_btn"></a>
      </div>
      <div class="unit">
        <div class="g" aria-hidden="true">한</div>
        <div><h3 data-t="u3_t"></h3><p data-t="u3_d"></p></div>
        <a class="btn btn-cta btn-sm" href="#unit3" data-t="u1_btn"></a>
      </div>
    </div>
  </div>
</section>

<section id="unit1">
  <div class="wrap">
    <div class="sec-head"><h2 data-t="l1_title"></h2><p data-t="l1_intro"></p></div>

    <div class="lesson">
      <div class="vowel-view">
        <div class="cell"><span class="glyph" id="vglyph" aria-hidden="true">ㅏ</span></div>
        <div class="readout" aria-live="polite">
          <div class="formula" id="vformula">아 = ㅇ + ㅏ</div>
          <div class="sound">
            <span><span data-t="l1_sounds"></span> <strong id="vroman">a</strong></span>
            <button type="button" class="listen" id="vlisten" hidden data-t="b_listen"></button>
          </div>
          <p class="vowel-desc" id="vdesc"></p>
        </div>
      </div>

      <div>
        <div class="vgroup" role="group" aria-labelledby="vl-right">
          <span class="label" id="vl-right" data-t="l1_right"></span>
          <div class="chips" id="vg-right"></div>
        </div>
        <div class="vgroup" role="group" aria-labelledby="vl-below">
          <span class="label" id="vl-below" data-t="l1_below"></span>
          <div class="chips" id="vg-below"></div>
        </div>
        <p class="tip" data-t="l1_o"></p>
        <p class="note" style="margin-top:16px" data-t="l1_note"></p>
      </div>
    </div>

    <div class="sub">
      <h3 data-t="w_title"></h3>
      <p data-t="w_sub"></p>
      <div class="words" id="words"></div>
    </div>

    <div class="sub">
      <h3 data-t="q_title"></h3>
      <div class="quiz" id="quiz"></div>
    </div>
  </div>
</section>

<section id="unit2">
  <div class="wrap">
    <div class="sec-head"><h2 data-t="l2_title"></h2><p data-t="l2_intro"></p></div>

    <div class="lesson">
      <div class="vowel-view">
        <div class="cell"><span class="glyph" id="cglyph" aria-hidden="true">ㄱ</span></div>
        <div class="readout" aria-live="polite">
          <div class="formula" id="cformula">가 = ㄱ + ㅏ</div>
          <div class="sound">
            <span><span data-t="l1_sounds"></span> <strong id="croman">g</strong></span>
            <button type="button" class="listen" id="clisten" hidden data-t="b_listen"></button>
          </div>
          <p class="vowel-desc" id="cdesc"></p>
        </div>
      </div>

      <div>
        <div class="vgroup" role="group" aria-labelledby="cl-group1">
          <span class="label" id="cl-group1" data-t="l2_group1"></span>
          <div class="chips" id="cg-group1"></div>
        </div>
        <div class="vgroup" role="group" aria-labelledby="cl-group2">
          <span class="label" id="cl-group2" data-t="l2_group2"></span>
          <div class="chips" id="cg-group2"></div>
        </div>
        <p class="tip" data-t="l2_tip"></p>
        <p class="note" style="margin-top:16px" data-t="l2_note"></p>
      </div>
    </div>

    <div class="sub">
      <h3 data-t="w2_title"></h3>
      <p data-t="w2_sub"></p>
      <div class="words" id="words2"></div>
    </div>

    <div class="sub">
      <h3 data-t="q_title"></h3>
      <div class="quiz" id="quiz2"></div>
    </div>
  </div>
</section>

<section id="unit3">
  <div class="wrap">
    <div class="sec-head"><h2 data-t="l3_title"></h2><p data-t="l3_intro"></p></div>

    <div class="lesson">
      <div class="vowel-view">
        <div class="cell"><span class="glyph" id="bglyph" aria-hidden="true">ㄱ</span></div>
        <div class="readout" aria-live="polite">
          <div class="formula" id="bformula">악 = ㅇ + ㅏ + ㄱ</div>
          <div class="sound">
            <span><span data-t="l1_sounds"></span> <strong id="broman">k</strong></span>
            <button type="button" class="listen" id="blisten" hidden data-t="b_listen"></button>
          </div>
          <p class="vowel-desc" id="bdesc"></p>
        </div>
      </div>

      <div>
        <div class="vgroup" role="group" aria-labelledby="bl-group1">
          <span class="label" id="bl-group1" data-t="l3_group1"></span>
          <div class="chips" id="bg-group1"></div>
        </div>

/* ---------- Helpers ---------- */
function el(tag, cls, text){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function fill(s, map){
  return s.replace(/\{(\w+)\}/g, function(m, k){ return map[k] !== undefined ? map[k] : m; });
}
function shuffle(a){
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

var listenBtns = document.querySelectorAll('.listen');
function checkVoice(){
  var has = false;
  try {
    has = window.speechSynthesis.getVoices().some(function(v){ return v.lang && v.lang.toLowerCase().indexOf('ko') === 0; });
  } catch(e) {}
  listenBtns.forEach(function(b){ b.hidden = !has; });
}
function speak(text){
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    u.rate = 0.8;
    window.speechSynthesis.speak(u);
  } catch(e) {}
}

  checkVoice();

var state = { i:'ㅎ', m:'ㅏ', f:'ㄴ' };
var glyph = document.getElementById('glyph');

function syllable(){
  var code = 0xAC00 + (ALL_I.indexOf(state.i) * 21 + ALL_M.indexOf(state.m)) * 28 + ALL_F.indexOf(state.f);
  return String.fromCharCode(code);
}
function render(pop){
  var ch = syllable();
  glyph.textContent = ch;
  document.getElementById('formula').textContent = ch + ' = ' + state.i + ' + ' + state.m + (state.f ? ' + ' + state.f : '');
  document.getElementById('roman').textContent = R_I[ALL_I.indexOf(state.i)] + R_M[ALL_M.indexOf(state.m)] + R_F[state.f];
  if (pop){
    glyph.classList.remove('settle','pop');
    void glyph.offsetWidth;
    glyph.classList.add('pop');
  }
}
function buildChips(id, list, key){
  var box = document.getElementById(id);
  list.forEach(function(v){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.dataset.v = v;
    if (v === ''){ b.classList.add('chip-none'); b.setAttribute('data-t','b_none'); }
    else { b.textContent = v; }
    b.setAttribute('aria-pressed', state[key] === v);
    b.addEventListener('click', function(){
      state[key] = v;
      box.querySelectorAll('.chip').forEach(function(c){ c.setAttribute('aria-pressed', c.dataset.v === v); });
      render(true);
    });
    box.appendChild(b);
  });
}
buildChips('chips-i', SHOW_I, 'i');
buildChips('chips-m', SHOW_M, 'm');
buildChips('chips-f', SHOW_F, 'f');

      return { v: v, type: Math.random() < 0.5 ? 'sound' : 'letter', opts: shuffle([v].concat(others)) };
    })
  };
  renderQuiz(false);
}
function renderQuiz(focusNext){
  if (!quiz) return;
  var box = document.getElementById('quiz');
  var t = T[lang];
  box.textContent = '';
  if (quiz.done){
    box.appendChild(el('p', 'qz-result', fill(t.qz_result, { n: quiz.score, t: quiz.qs.length })));
    box.appendChild(el('p', 'qz-sub', quiz.score === quiz.qs.length ? t.qz_r_high : t.qz_r_low));
    var again = el('button', 'btn btn-line btn-sm', t.qz_again);
    again.type = 'button';
    again.addEventListener('click', startQuiz);
    box.appendChild(again);
    return;
  }
  var q = quiz.qs[quiz.idx];
  box.appendChild(el('p', 'qz-progress', fill(t.qz_q, { n: quiz.idx + 1, t: quiz.qs.length })));
  if (q.type === 'sound'){
    box.appendChild(el('p', 'qz-prompt', fill(t.qz_p1, { s: q.v.r })));
  } else {
    box.appendChild(el('p', 'qz-prompt', t.qz_p2));
    box.appendChild(el('div', 'qz-glyph', q.v.v));
  }
  var grid = el('div', 'qz-opts');
  q.opts.forEach(function(o){
    var b = el('button', 'opt' + (q.type === 'sound' ? ' opt-glyph' : ''), q.type === 'sound' ? o.v : o.r);
    b.type = 'button';
    if (quiz.picked){
      if (o === q.v) b.classList.add('ok');
      else if (o === quiz.picked) b.classList.add('bad');
    }
    b.addEventListener('click', function(){
      if (quiz.picked) return;
      quiz.picked = o;
      if (o === q.v) quiz.score++;
      renderQuiz(true);
    });
    grid.appendChild(b);
  });
  box.appendChild(grid);
  var fb = el('p', 'qz-feedback');
  fb.setAttribute('role', 'status');
  if (quiz.picked){
    fb.textContent = quiz.picked === q.v ? t.qz_ok : fill(t.qz_no, { v: q.v.v, s: q.v.r });
  }
  box.appendChild(fb);
  if (quiz.picked){
    var last = quiz.idx === quiz.qs.length - 1;
    var nx = el('button', 'btn btn-cta btn-sm', last ? t.qz_finish : t.qz_next);
    nx.type = 'button';
    nx.addEventListener('click', function(){
      if (last) { quiz.done = true; } else { quiz.idx++; quiz.picked = null; }

    });
    box.appendChild(nx);
    if (focusNext) nx.focus();
  }
}
